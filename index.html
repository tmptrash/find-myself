<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>rootward</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="rootward">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* The page never scrolls or zooms by touch: without this a windowed mobile browser
       runs scroll / pull-to-refresh / URL-bar gesture handling on every touch drag */
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background-color: #000000 !important;
  }
  body {
    font-family: 'JetBrains Mono', monospace;
  }
  canvas {
    display: block;
  }
  /* The start loader's eye looks about while the game's code is on its way */
  @keyframes loader-start-look {
    0%, 38% { transform: translate(0, 0); }
    48%, 88% { transform: translate(5px, 1px); }
    100% { transform: translate(0, 0); }
  }
  #loader-start-pupil {
    animation: loader-start-look 2.6s ease-in-out infinite;
  }
</style>
</head>
<body>
  <!--
    The loader is on screen from the page's very first paint, before any of
    the game's code has come in (a slow network or CPU would otherwise show
    a black screen): the loader's eye as boot-loader.js draws it at 0 % — the
    same place, size and colours (CFG.visual.colors.loader) — so the real
    loader takes over without a jump (it rebuilds this panel: showLoader).
    The stylesheets come after it, so they never hold its first paint back.
  -->
  <div id="loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: 'JetBrains Mono', monospace;">
    <div style="display: flex; flex-direction: column; align-items: center; padding: 28px min(40px, 5vw); border-radius: 8px;">
      <svg width="360" height="96" viewBox="0 0 360 96" style="overflow: visible; width: min(360px, 62vw); height: auto;">
        <g transform="translate(26 48)">
          <circle r="13.35" fill="#854f48"/>
          <circle r="12" fill="#c4b493"/>
          <circle cx="-1.68" cy="-2.64" r="10.32" fill="#f4f1de"/>
          <circle id="loader-start-pupil" r="4.8" fill="#1c4c51"/>
        </g>
      </svg>
    </div>
  </div>
  <link rel="stylesheet" href="/fonts/jetbrains_mono.css">
  <link rel="stylesheet" href="/cursor.css">
  <script src="src/index.js" type="module"></script>
</body>
</html>
